<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tweetshelf · Prueba de enlaces</title>
  <style>
    /* Página temporal de prueba de concepto: no forma parte de la app. */
    :root { --bg: #f6f3ee; --panel: #fffdf9; --body: #1d1b18; --muted: #77706a; --line: #e7e1d8; --sunk: #efeae2;
      --btn: #fffdf9; --btn-line: #d9d2c7; --accent: #d9480f; --ok: #2b8a3e; --danger: #e03131; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #15140f; --panel: #1f1d18; --body: #efe9df; --muted: #9c948a; --line: #34302a; --sunk: #1a1814;
        --btn: #2a2722; --btn-line: #3d3830; --accent: #ff8a4c; --ok: #69db7c; --danger: #ff6b6b; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--body); font: 15px/1.5 system-ui, sans-serif; padding: 16px; }
    main { max-width: 820px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p { color: var(--muted); margin: 0 0 14px; }
    form { display: flex; gap: 8px; margin-bottom: 10px; }
    input { flex: 1; min-width: 0; height: 42px; padding: 0 12px; border: 1px solid var(--btn-line); border-radius: 10px;
      background: var(--panel); color: inherit; font: inherit; }
    button { height: 42px; padding: 0 14px; border: 1px solid var(--btn-line); border-radius: 10px; background: var(--btn);
      color: inherit; font: inherit; cursor: pointer; }
    .ejemplos { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
    .ejemplos button { height: 34px; font-size: 13px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .card h2 { font-size: 16px; margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .ok { color: var(--ok); } .mal { color: var(--danger); }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 0; font-size: 14px; }
    dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
    details { margin-top: 8px; } summary { cursor: pointer; color: var(--muted); font-size: 13px; }
    pre { background: var(--sunk); padding: 10px; border-radius: 8px; overflow: auto; max-height: 360px; font-size: 12px; }
    .muestra { white-space: pre-wrap; background: var(--sunk); padding: 8px 10px; border-radius: 8px; font-size: 14px;
      max-height: 160px; overflow: auto; margin-top: 6px; }
  </style>
</head>
<body>
<main>
  <h1>Prueba: añadir por enlace</h1>
  <p>Pega el enlace de un tuit. El servidor lo pide a FxTwitter y a X y enseña qué llega. No se guarda nada.</p>
  <form id="f"><input id="u" placeholder="https://x.com/usuario/status/123…" autocomplete="off"><button>Probar</button></form>
  <div class="ejemplos" id="ejemplos"></div>
  <div id="out"></div>
</main>
<script type="module">
// Ejemplos de la copia de Javier: hilos y Artículos de X que ya están en la app, para comparar.
const EJEMPLOS = [
  ["Hilo de 8 · maxpradera", "https://x.com/maxpradera/status/2058791548200817084"],
  ["Hilo de 8 · bcherny", "https://x.com/bcherny/status/2044847848035156457"],
  ["Artículo · theo", "https://x.com/theo/status/2113424203345265053"],
  ["Artículo · silvanrec", "https://x.com/silvanrec/status/2090280285623464099"],
];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const $ = (s) => document.querySelector(s);

$("#ejemplos").innerHTML = EJEMPLOS.map(([t, u]) => `<button data-u="${esc(u)}">${esc(t)}</button>`).join("");
$("#ejemplos").onclick = (e) => { const u = e.target.dataset.u; if (u) { $("#u").value = u; probar(u); } };
$("#f").onsubmit = (e) => { e.preventDefault(); probar($("#u").value.trim()); };
const q = new URLSearchParams(location.search).get("url");
if (q) { $("#u").value = q; probar(q); }

// Busca por todo el JSON sin suponer su forma: no sabemos aún qué campos trae cada fuente.
function walk(o, fn, path = "") {
  if (o && typeof o === "object") for (const [k, v] of Object.entries(o)) { fn(k, v, path + "." + k); walk(v, fn, path + "." + k); }
}
function resumen(data) {
  let texto = "", articulo = null, hilo = null, medios = 0, cita = false;
  walk(data, (k, v, p) => {
    if ((k === "text" || k === "full_text" || k === "raw_text") && typeof v === "string" && v.length > texto.length && !p.includes("quote") && !p.includes("article")) texto = v;
    if (k === "article" && v && typeof v === "object" && !articulo) articulo = v;
    if (/^(thread|tweets|statuses|replies)$/.test(k) && Array.isArray(v) && (!hilo || v.length > hilo.n)) hilo = { n: v.length, en: p };
    if ((k === "photos" || k === "videos" || k === "mediaDetails") && Array.isArray(v)) medios = Math.max(medios, v.length);
    if (k === "quote" || k === "quoted_tweet") cita = true;
  });
  let artTexto = "";
  if (articulo) walk(articulo, (k, v) => { if (k === "text" && typeof v === "string") artTexto += v + "\n"; });
  return { texto, articulo, artTexto: artTexto.trim(), hilo, medios, cita };
}

async function probar(link) {
  if (!link) return;
  $("#out").innerHTML = `<p>Probando…</p>`;
  const r = await fetch("/api/prueba-fx?url=" + encodeURIComponent(link));
  if (r.status === 401) { location.href = "/login"; return; }
  const d = await r.json();
  if (d.error || d.detail) { $("#out").innerHTML = `<p class="mal">${esc(d.error || d.detail)}</p>`; return; }
  // Lo que ya tenemos guardado (si está), para comparar.
  const guardado = await fetch("/api/items/" + d.id).then((x) => (x.ok ? x.json() : null)).catch(() => null);
  const g = guardado ? `<div class="card"><h2>Lo que ya hay en Tweetshelf</h2><dl>
      <dt>Texto</dt><dd>${guardado.tweet_text.length} caracteres</dd>
      <dt>Hilo</dt><dd>${guardado.thread ? guardado.thread.length + " tuits" : "no"}</dd>
      <dt>Artículo</dt><dd>${guardado.article_words ? esc(guardado.article_title || "") + " · " + guardado.article_words + " palabras" : "no"}</dd>
    </dl></div>` : `<p>Este tuit no está en Tweetshelf.</p>`;
  $("#out").innerHTML = g + d.results.map((x) => {
    const s = x.data ? resumen(x.data) : null;
    const estado = x.status >= 200 && x.status < 300 ? "ok" : "mal";
    return `<div class="card">
      <h2>${esc(x.name)} <span class="${estado}">${x.status || "sin respuesta"}</span> <small>${x.ms} ms</small></h2>
      ${x.error ? `<p class="mal">${esc(x.error)}</p>` : ""}
      ${s ? `<dl>
        <dt>Texto</dt><dd>${s.texto.length} caracteres</dd>
        <dt>Hilo</dt><dd>${s.hilo ? `${s.hilo.n} elementos (en <code>${esc(s.hilo.en)}</code>)` : "no"}</dd>
        <dt>Artículo</dt><dd>${s.articulo ? `${esc(s.articulo.title || "sí")} · texto ${s.artTexto.length} caracteres` : "no"}</dd>
        <dt>Medios</dt><dd>${s.medios}</dd>
        <dt>Cita</dt><dd>${s.cita ? "sí" : "no"}</dd>
      </dl>
      ${s.texto ? `<div class="muestra">${esc(s.texto.slice(0, 600))}</div>` : ""}
      ${s.artTexto ? `<div class="muestra">${esc(s.artTexto.slice(0, 600))}…</div>` : ""}` : ""}
      <details><summary>Respuesta completa</summary><pre>${esc(x.data ? JSON.stringify(x.data, null, 2).slice(0, 30000) : x.raw || "")}</pre></details>
    </div>`;
  }).join("");
}
</script>
</body>
</html>
