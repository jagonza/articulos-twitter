name: Extraer artículos

on:
  schedule:
    - cron: "17 */3 * * *"  # cada 3 horas
  workflow_dispatch:

concurrency:
  group: extract
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: extractor/requirements.txt
      - run: pip install -r extractor/requirements.txt
      - run: python run.py
        working-directory: extractor
        env:
          TWEETSHELF_URL: ${{ secrets.TWEETSHELF_URL }}
          TWEETSHELF_TOKEN: ${{ secrets.TWEETSHELF_TOKEN }}
