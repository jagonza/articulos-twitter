<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tweetshelf · Entrar</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <style>
    :root { --bg: #f6f3ee; --panel: #fffdf9; --ink: #1d1b18; --muted: #77706a; --line: #e7e1d8; --accent: #d9480f; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #15140f; --panel: #1f1d18; --ink: #efe9df; --muted: #9c948a; --line: #34302a; --accent: #ff8a4c; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
      font: 15px/1.5 "Inter", system-ui, sans-serif; padding: 16px; }
    form { width: min(360px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
      padding: 30px 26px; box-shadow: 0 10px 40px #0000001a; text-align: center; }
    .logo { font-size: 44px; }
    h1 { font: 700 26px "Fraunces", Georgia, serif; margin: 4px 0 2px; }
    p { color: var(--muted); margin: 0 0 22px; }
    input { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 11px; font: inherit;
      background: var(--bg); color: inherit; margin-bottom: 12px; }
    input:focus { outline: 2px solid var(--accent); border-color: transparent; }
    button { width: 100%; padding: 12px; border: 0; border-radius: 11px; background: var(--accent); color: #fff;
      font: 600 15px inherit; cursor: pointer; font-family: inherit; }
    .error { color: #e03131; min-height: 1.5em; margin-top: 10px; font-size: 14px; }
  </style>
</head>
<body>
  <form id="f">
    <div class="logo">📚</div>
    <h1>Tweetshelf</h1>
    <p>Tu estantería de X</p>
    <input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password" autofocus required>
    <button>Entrar</button>
    <div class="error" id="err"></div>
  </form>
  <script>
    document.getElementById("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      err.textContent = "";
      const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: document.getElementById("pw").value }) });
      if (r.ok) location.href = "/";
      else err.textContent = (await r.json().catch(() => ({}))).detail || "No se pudo entrar";
    });
  </script>
</body>
</html>
